    <section class="mx-auto max-w-3xl rounded-xl border border-slate-200 bg-white p-6 shadow-soft">
      <h2 class="text-lg font-bold text-slate-800">Modifier un equipement</h2>
      <form class="mt-4 grid gap-4 sm:grid-cols-2" method="post">
        {% csrf_token %}
        <input type="hidden" name="action" value="edit_materiel">
        <input type="hidden" name="materiel_id" value="{{ target.id_materiel }}">
        {% for field in editMaterielForm %}
          <div>
            <label class="mb-1 block text-sm font-semibold text-slate-700">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}<p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>{% endif %}
            {% for error in field.errors %}<p class="mt-1 text-xs text-red-600">{{ error }}</p>{% endfor %}
          </div>
        {% endfor %}
        <div class="sm:col-span-2 flex items-center gap-3 pt-2">
          <button class="btn-primary" type="submit">Sauvegarder</button>
          <a class="text-sm font-medium text-slate-500 hover:text-slate-700" href="{% url 'equipement:dashboard' %}?tab=list">Annuler</a>
        </div>
      </form>
</section>
