<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connexion - Gestion Equipement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              greenBrand: { 500: "#15803d", 600: "#166534", 700: "#14532d" },
              darkPanel: "#0f2a1f",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800">
    <div class="mx-auto grid min-h-screen w-full max-w-6xl items-center px-4 py-8 lg:grid-cols-2 lg:gap-12">
      <div class="hidden rounded-2xl bg-darkPanel p-10 text-white shadow-2xl lg:block">
        <div class="mb-6 flex items-center gap-3">
          <div class="grid h-10 w-10 place-items-center rounded-lg bg-greenBrand-600 shadow">
            <svg class="h-6 w-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7l9-4 9 4-9 4-9-4z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 17l9 4 9-4"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9 4 9-4"/>
            </svg>
          </div>
          <p class="text-xs font-bold uppercase tracking-widest text-emerald-200">Module gestionnaire</p>
        </div>
        <h1 class="mt-2 text-4xl font-bold leading-tight">Gestion des equipements</h1>
        <p class="mt-4 text-sm leading-relaxed text-emerald-100/80">Connectez-vous pour piloter les emprunts et administrer le parc d'equipements.</p>
      </div>

      <div class="mx-auto w-full max-w-md">
        <div class="rounded-2xl border border-slate-200 bg-white p-7 shadow-xl">
          <a href="{% url 'users:module_choice' %}" class="mb-4 inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-700">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg>
            Retour au choix des modules
          </a>
          <h2 class="text-2xl font-bold text-slate-800">Connexion gestionnaire</h2>

          {% if messages %}
            <div class="mt-4 space-y-2">
              {% for message in messages %}
                <div class="rounded-lg border px-3 py-2.5 text-sm font-medium {% if 'error' in message.tags %}border-red-200 bg-red-50 text-red-800{% else %}border-slate-200 bg-slate-50 text-slate-700{% endif %}">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          {% endif %}

          <form method="post" class="mt-5 space-y-4" novalidate>
            {% csrf_token %}
            <div>
              <label for="id_email" class="mb-1 block text-sm font-semibold text-slate-700">Email</label>
              <input type="email" name="{{ form.email.name }}" id="id_email" value="{{ form.email.value|default_if_none:'' }}" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-greenBrand-500 focus:ring-2 focus:ring-emerald-100" />
            </div>
            <div>
              <label for="id_password" class="mb-1 block text-sm font-semibold text-slate-700">Mot de passe</label>
              <input type="password" name="{{ form.password.name }}" id="id_password" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-greenBrand-500 focus:ring-2 focus:ring-emerald-100" />
            </div>
            <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-lg bg-greenBrand-600 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-greenBrand-700">
              Se connecter
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
